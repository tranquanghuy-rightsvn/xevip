<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang quản trị - Xe VIP Sân Bay</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="/images/cropped-logo-xe-vip-noi-bai-final-32x32.png">
<!-- ============================ BẢN THỬ NGHIỆM ============================
     Đây KHÔNG phải trang quản trị chính thức. /admin/ vẫn giữ nguyên cách cũ (chuyển hướng)
     làm đường lui - không đụng vào.

     Mục đích: thử nhúng trang quản trị vào ngay domain của mình để (1) cắt thanh cảnh báo
     "This application was created by a Google Apps Script user" (cao đúng 25px, đã đo bằng
     trình duyệt) và (2) thanh địa chỉ luôn là xevipsanbay.com.

     KẾT QUẢ THỬ NGÀY 27/08/2026 trên Chrome đang đăng nhập tài khoản Workspace công ty:
     THẤT BẠI - Google tự chuyển hướng sang URL riêng của Workspace
     (script.google.com/a/macros/<domain>/s/.../exec) và request đó treo vĩnh viễn khi bị
     nhúng (pending, không lỗi, không nội dung). Đang thử lại bằng tài khoản Gmail cá nhân
     xem có tránh được cú chuyển hướng đó không.

     Cắt thanh cảnh báo bằng CSS (kéo iframe lên 25px trong khung overflow:hidden). KHÔNG
     đụng vào DOM trang kia - khác origin nên không thể đụng, và cũng không cần.
     ======================================================================== -->
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #f5f6f8;
               font-family: "Open Sans", "Segoe UI", sans-serif; color: #1c1c1c; }
  /* Chiều cao thanh cảnh báo của Google, đo thật 27/08/2026. Google đổi giao diện thì sửa
     đúng 1 con số này. */
  :root { --gg-warning-height: 25px; }

  .cms-viewport { position: fixed; inset: 0; overflow: hidden; }
  .cms-frame {
    position: absolute;
    top: calc(var(--gg-warning-height) * -1);
    left: 0;
    width: 100%;
    height: calc(100% + var(--gg-warning-height));
    border: 0;
    display: block;
  }

  /* Lớp phủ báo trạng thái. Bản trước để z-index âm nên khi iframe treo thì người dùng chỉ
     thấy màn hình trắng, không biết chuyện gì - lần này nằm ĐÈ LÊN và tự ẩn khi iframe tải
     xong thật. */
  .cms-status {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 24px; background: #f5f6f8;
  }
  .cms-status.hidden { display: none; }
  .cms-status h2 { font-size: 18px; margin: 0 0 8px; }
  .cms-status p { font-size: 14px; color: #666; margin: 6px 0; line-height: 1.6; }
  .cms-status a {
    display: inline-block; margin-top: 14px; padding: 10px 18px; border-radius: 6px;
    background: #d02128; color: #fff; text-decoration: none; font-weight: 600;
  }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 16px;
    border: 3px solid rgba(0,0,0,.1); border-top-color: #d02128; border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="cms-status" id="cms-status">
  <div>
    <div class="spinner" id="cms-spinner"></div>
    <h2 id="cms-status-title">Đang mở trang quản trị...</h2>
    <p id="cms-status-text">Nếu quá 12 giây vẫn chưa vào được, dùng nút bên dưới.</p>
    <a id="cms-open-tab" href="#" rel="nofollow noreferrer" style="display:none">Mở ở tab riêng</a>
  </div>
</div>

<div class="cms-viewport">
  <iframe class="cms-frame" id="cms-frame" title="Trang quản trị" referrerpolicy="no-referrer"></iframe>
</div>

<script>
  var CMS_URL = 'https://script.google.com/macros/s/AKfycbwjfcy82c6_ywQIN_pffWpCiAEfw-pVPDR996NOPEqwq5SobbP4GiX26npARxfligFHbQ/exec';

  var frame = document.getElementById('cms-frame');
  var statusBox = document.getElementById('cms-status');
  var loaded = false;

  document.getElementById('cms-open-tab').href = CMS_URL;

  // Sự kiện load của iframe VẪN bắn kể cả khi nội dung khác origin (chỉ là không đọc được
  // bên trong) - đủ để phân biệt "đã tải được" với "treo".
  frame.addEventListener('load', function () {
    loaded = true;
    statusBox.classList.add('hidden');
    console.log('[admin-test] iframe đã tải xong -> NHÚNG ĐƯỢC');
  });

  // Treo quá lâu -> hiện lối thoát, không để người dùng nhìn màn hình trắng.
  setTimeout(function () {
    if (loaded) return;
    console.warn('[admin-test] iframe không tải được sau 12 giây -> Google chặn nhúng');
    document.getElementById('cms-spinner').style.display = 'none';
    document.getElementById('cms-status-title').textContent = 'Không nhúng được trang quản trị';
    document.getElementById('cms-status-text').textContent =
      'Google không cho hiển thị trang quản trị bên trong website. Bấm nút bên dưới để mở bình thường.';
    document.getElementById('cms-open-tab').style.display = 'inline-block';
  }, 12000);

  frame.src = CMS_URL;
</script>
</body>
</html>
